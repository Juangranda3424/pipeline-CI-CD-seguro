name: CI/CD Pipeline Seguro

on:
  pull_request:
    branches:
      - test

permissions:
  contents: write
  pull-requests: write

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install

      # ==========================================
      # ETAPA 1: (Aquí colocas tu modelo de IA de Seguridad)
      # ==========================================

      # ==========================================
      # ETAPA 2: Ejecutar Pruebas
      # ==========================================
        Tibia - name: Run tests
        run: pnpm test

      - name: Telegram Error en Tests
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="❌ Los tests fallaron. PR no fusionado."

      # ==========================================
      # ETAPA 3: Merge Automático a Test usando GitHub CLI
      # ==========================================
      - name: Merge Pull Request a Test
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --merge --auto

      - name: Telegram Success Test
        if: success()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="✅ Tests aprobados. PR fusionado automáticamente a test."

      # ==========================================
      # ETAPA 4: Merge directo a MAIN (Producción)
      # ==========================================
      - name: Configure Git
        if: success()
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Merge test into main & Push
        if: success()
        run: |
          git fetch origin
          git checkout main
          git merge origin/test --no-edit
          git push origin main

      # ==========================================
      # ETAPA 5: Aquí colocas tu comando de build/deploy Docker a Vercel/Render
      # ==========================================

      - name: Notificar despliegue exitoso a Main
        if: success()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="🚀 Merge automático test → main y despliegue realizado correctamente."