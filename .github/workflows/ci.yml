name: CI/CD Pipeline Seguro

on:
  pull_request:
    branches:
      - test

permissions:
  contents: write
  pull-requests: write

jobs:
  pipeline-completo:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # CONFIGURACIÓN INICIAL
      # ==========================================
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesario para traer el historial y hacer el merge entre ramas

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Al no poner "version", leerá automáticamente el pnpm@9.0.0 de tu package.json

      - name: Instalar dependencias
        run: pnpm install


      # ==========================================
      # ETAPA 1: REVISIÓN DE SEGURIDAD (MODELO IA)
      # ==========================================
      # Nota: Aquí debes integrar la ejecución de tu script de Python / Scikit-Learn.
      # Si el modelo detecta "VULNERABLE", tu script debe lanzar un 'exit 1' para detener el pipeline.
      - name: Análisis de Seguridad con Machine Learning
        run: |
          echo "Ejecutando modelo de minería de datos para detección de vulnerabilidades..."
          # Ejemplo: python scripts/security_model.py
          

      # ==========================================
      # ETAPA 2: PRUEBAS UNITARIAS Y MERGE A TEST
      # ==========================================
      - name: Ejecutar Pruebas
        run: pnpm test

      - name: Telegram - Error en Pruebas o Seguridad
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="❌ El pipeline falló en la etapa de validación. PR bloqueado o tests fallidos. Revisar logs."

      - name: Merge Automático a rama TEST
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Validaciones correctas. Fusionando automáticamente a la rama test..."
          gh pr merge ${{ github.event.pull_request.number }} --merge --auto

      - name: Telegram - Merge a Test Exitoso
        if: success()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="✅ Tests aprobados. PR fusionado automáticamente a la rama 'test'."


      # ==========================================
      # ETAPA 3: MERGE AUTOMÁTICO A MAIN (PRODUCCIÓN)
      # ==========================================
      - name: Configurar credenciales de Git
        if: success()
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Fusionar cambios de Test a Main vía Git
        if: success()
        run: |
          git fetch origin
          git checkout main
          git merge origin/test --no-edit
          git push origin main


      # ==========================================
      # ETAPA 4: DESPLIEGUE (DOCKER / VERCEL / RENDER)
      # ==========================================
      # Nota: Aquí añadirás tus comandos finales para compilar tu Dockerfile o subir a tu nube.
      - name: Ejecutar Build y Despliegue en Producción
        if: success()
        run: |
          echo "Iniciando despliegue de la imagen de producción..."
          # Aquí van tus comandos de Docker o el CLI del proveedor que elijas

      - name: Telegram - Despliegue Final Exitoso
        if: success()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="🚀 ¡Todo listo! El código se encuentra unificado en 'main' y desplegado correctamente."