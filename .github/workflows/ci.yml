name: CI/CD Pipeline Seguro

on:
pull_request:
branches:
- test

permissions:
contents: write
pull-requests: write
issues: write

jobs:
pipeline-completo:
runs-on: ubuntu-latest

steps:

  # ==========================================
  # CHECKOUT
  # ==========================================
  - name: Checkout del código
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  # ==========================================
  # TELEGRAM - INICIO
  # ==========================================
  - name: Telegram - Inicio de revisión
    run: |
      curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
      -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
      -d text="🔍 Iniciando análisis de seguridad del Pull Request..."

  # ==========================================
  # NODE
  # ==========================================
  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22

  - name: Setup pnpm
    uses: pnpm/action-setup@v4
    with:
      version: 10

  - name: Instalar dependencias Node
    run: pnpm install

  # ==========================================
  # PYTHON
  # ==========================================
  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.13'

  - name: Instalar dependencias ML
    run: |
      pip install pandas
      pip install numpy
      pip install scipy
      pip install scikit-learn
      pip install joblib

  # ==========================================
  # OBTENER CAMBIOS DEL PR
  # ==========================================
  - name: Obtener código modificado
    run: |
      git fetch origin test
      git diff origin/test...HEAD > changed_code.txt

  # ==========================================
  # ETAPA 1 - IA
  # ==========================================
  - name: Análisis de Seguridad con Machine Learning
    id: security_scan
    run: |
      python ml/security_scan.py

  # ==========================================
  # PR VULNERABLE
  # ==========================================
  - name: Crear Issue por vulnerabilidad
    if: failure()
    uses: actions/github-script@v7
    with:
      script: |
        github.rest.issues.create({
          owner: context.repo.owner,
          repo: context.repo.repo,
          title: "Vulnerabilidad detectada por IA",
          body: `
          El modelo Random Forest detectó código vulnerable.

          Pull Request:
          #${context.issue.number}

          Acción requerida:
          Revisar y corregir antes de volver a enviar.
          `
        })

  - name: Agregar etiqueta fixing-required
    if: failure()
    uses: actions/github-script@v7
    with:
      script: |
        github.rest.issues.addLabels({
          owner: context.repo.owner,
          repo: context.repo.repo,
          issue_number: context.issue.number,
          labels: ["fixing-required"]
        })

  - name: Comentar Pull Request
    if: failure()
    uses: actions/github-script@v7
    with:
      script: |
        github.rest.issues.createComment({
          owner: context.repo.owner,
          repo: context.repo.repo,
          issue_number: context.issue.number,
          body: `
          ❌ Vulnerabilidad detectada automáticamente.

          Clasificación: VULNERABLE

          El merge ha sido bloqueado.
          `
        })

  - name: Telegram - Vulnerabilidad detectada
    if: failure()
    run: |
      curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
      -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
      -d text="🚨 Código VULNERABLE detectado. PR bloqueado automáticamente."

  # ==========================================
  # ETAPA 2 - TESTS
  # ==========================================
  - name: Telegram - Código seguro
    if: success()
    run: |
      curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
      -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
      -d text="✅ Código clasificado como SEGURO. Iniciando pruebas."

  - name: Ejecutar pruebas
    run: pnpm test

  - name: Telegram - Error en pruebas
    if: failure()
    run: |
      curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
      -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
      -d text="❌ Fallaron las pruebas unitarias."

  - name: Agregar etiqueta tests-failed
    if: failure()
    uses: actions/github-script@v7
    with:
      script: |
        github.rest.issues.addLabels({
          owner: context.repo.owner,
          repo: context.repo.repo,
          issue_number: context.issue.number,
          labels: ["tests-failed"]
        })

  # ==========================================
  # MERGE AUTOMÁTICO A TEST
  # ==========================================
  - name: Merge automático a test
    if: success()
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    run: |
      gh pr merge ${{ github.event.pull_request.number }} --merge --auto

  - name: Telegram - Merge a test exitoso
    if: success()
    run: |
      curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
      -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
      -d text="✅ Pull Request fusionado correctamente a test."

  # ==========================================
  # ETAPA 3 - MAIN
  # ==========================================
  - name: Configurar Git
    if: success()
    run: |
      git config --global user.name "github-actions"
      git config --global user.email "github-actions@github.com"

  - name: Fusionar test a main
    if: success()
    run: |
      git fetch origin
      git checkout main
      git merge origin/test --no-edit
      git push origin main

  # ==========================================
  # ETAPA 4 - DOCKER
  # ==========================================
  - name: Build Docker
    if: success()
    run: |
      docker build -t secure-app .

  # ==========================================
  # DESPLIEGUE
  # ==========================================
  - name: Deploy Producción
    if: success()
    run: |
      echo "Desplegando aplicación..."

  # ==========================================
  # TELEGRAM FINAL
  # ==========================================
  - name: Telegram - Despliegue exitoso
    if: success()
    run: |
      curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
      -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
      -d text="🚀 Pipeline completado. Código desplegado en producción."

  - name: Telegram - Error general
    if: failure()
    run: |
      curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
      -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
      -d text="❌ Pipeline fallido. Revisar GitHub Actions."
