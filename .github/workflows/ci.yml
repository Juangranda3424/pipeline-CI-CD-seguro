name: CI Pipeline

on:
pull_request:
branches:
- test

permissions:
contents: write

jobs:
test:
runs-on: ubuntu-latest

steps:
  - name: Notificar inicio de revisión
    run: |
      curl -s -X POST \
      https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
      -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
      -d text="🔍 Inicio de revisión de seguridad para PR dev → test"

  - name: Checkout
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: 22

  - name: Setup pnpm
    uses: pnpm/action-setup@v4
    with:
      version: 10

  - name: Install dependencies
    run: pnpm install

  - name: Run tests
    run: pnpm test

  - name: Merge automático dev -> test
    if: success()
    run: |
      git config --global user.name "github-actions"
      git config --global user.email "github-actions@github.com"

      git fetch origin

      git checkout test
      git merge origin/dev --no-edit

      git push origin test

  - name: Notificar pruebas exitosas
    if: success()
    run: |
      curl -s -X POST \
      https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
      -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
      -d text="✅ Pipeline aprobado. Merge dev → test realizado correctamente."

  - name: Notificar pruebas fallidas
    if: failure()
    run: |
      curl -s -X POST \
      https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
      -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
      -d text="❌ Pipeline falló. Revisar pruebas y corregir errores."
